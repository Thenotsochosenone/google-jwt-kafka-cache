akka {
  loglevel = "INFO"
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"

  kafka {
    consumer {
      kafka-clients {
        enable.auto.commit = false
      }
    }
    producer {
      kafka-clients {
        acks = "all"
        retries = 3
      }
    }
  }
}

app {
  kafka {
    bootstrap-servers = "localhost:9092"
    bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
    topic = "jwt-demo-topic"
    topic = ${?KAFKA_TOPIC}
  }

  metrics {
    port = 8080
    port = ${?METRICS_PORT}
  }

  producer {
    interval = 5s
    interval = ${?PRODUCER_INTERVAL}
  }

  google {
    # Optional: set to a target audience if you need ID tokens instead of access tokens
    # audience = "https://your-service.example.com"
  }
}
