akka {
  loglevel = "INFO"
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"

  kafka {
    consumer {
      kafka-clients {
        enable.auto.commit = false
      }
    }
    producer {
      kafka-clients {
        acks = "all"
        retries = 3
      }
    }
  }
}

# Dedicated pool for GoogleJwtTokenCache's blocking calls to Google's
# token endpoint (credentials.refreshIfExpired() / refreshAccessToken()
# are synchronous network I/O). Isolating them here means a slow or
# hanging Google API call can't starve the dispatcher backing Akka HTTP
# routes and the Kafka streams.
blocking-io-dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = 4
  }
  throughput = 1
}

app {
  kafka {
    bootstrap-servers = "localhost:9092"
    bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
    topic = "jwt-demo-topic"
    topic = ${?KAFKA_TOPIC}
  }

  metrics {
    port = 8080
    port = ${?METRICS_PORT}
  }

  producer {
    interval = 5s
    interval = ${?PRODUCER_INTERVAL}
  }

  google {
    # Optional: set to a target audience if you need ID tokens instead of access tokens
    # audience = "https://your-service.example.com"
  }
}